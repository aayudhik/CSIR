<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Schrodinger wavefunction psi versus probability density</title>
<desc id="desc">Three-row comparison for harmonic-oscillator ground and first excited states: the wavefunction psi may change sign, probability density absolute psi squared is nonnegative, and repeated position measurements form a histogram following the probability density.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#182235} .axis{stroke:#536174;stroke-width:2} .grid{stroke:#dfe5ee;stroke-width:1} .wave{fill:none;stroke:#3559a8;stroke-width:4} .density{fill:none;stroke:#8a3f8f;stroke-width:4} .hist{fill:#6b7280;opacity:.72} .zero{stroke:#b04a4a;stroke-width:2;stroke-dasharray:7 6}</style></defs>
<rect width="1200" height="900" rx="24" fill="#f8fafc"/>
<text x="60" y="58" font-size="30" font-weight="700">ψ versus |ψ|² — what a measurement actually samples</text>
<text x="60" y="88" font-size="17" fill="#536174">Example: harmonic oscillator ground state (even) and first excited state (odd)</text>
<g transform="translate(70,125)"><text x="0" y="20" font-size="22" font-weight="700">1. Wavefunction ψ(x)</text><text x="0" y="48" font-size="15">Amplitude can be positive, negative, or complex. Its sign/phase matters for interference.</text>
<line x1="0" y1="150" x2="1050" y2="150" class="zero"/><line x1="0" y1="30" x2="0" y2="260" class="axis"/><line x1="0" y1="260" x2="1050" y2="260" class="axis"/>
<path class="wave" d="M0 150 C100 20 190 20 285 150 C380 280 470 280 565 150 C660 20 750 20 845 150 C940 280 1000 250 1050 190"/>
<path d="M0 150 C70 75 130 55 195 80" fill="none" stroke="#9b59b6" stroke-width="3" stroke-dasharray="8 7"/>
<text x="1060" y="155" font-size="14">ψ=0</text><text x="470" y="285" font-size="14">position x</text></g>
<g transform="translate(70,405)"><text x="0" y="20" font-size="22" font-weight="700">2. Probability density |ψ|²</text><text x="0" y="48" font-size="15">Always non-negative. The area under |ψ|² over an interval is the probability of finding the particle there.</text>
<line x1="0" y1="260" x2="1050" y2="260" class="axis"/><line x1="0" y1="35" x2="0" y2="260" class="axis"/>
<path class="density" d="M0 260 C80 70 180 55 285 260 C390 70 475 55 565 260 C655 70 760 55 845 260 C930 100 1000 115 1050 210"/>
<path d="M0 260 C100 120 190 90 285 260 C390 120 475 90 565 260" fill="none" stroke="#8a3f8f" stroke-width="3"/>
<text x="1060" y="265" font-size="14">≥ 0</text><text x="470" y="285" font-size="14">position x</text></g>
<g transform="translate(70,685)"><text x="0" y="20" font-size="22" font-weight="700">3. Repeated position measurements</text><text x="0" y="48" font-size="15">A large sample of measurements forms a histogram whose envelope approaches the probability density.</text>
<line x1="0" y1="170" x2="1050" y2="170" class="axis"/><line x1="0" y1="45" x2="0" y2="170" class="axis"/>
<g class="hist"><rect x="25" y="145" width="35" height="25"/><rect x="65" y="118" width="35" height="52"/><rect x="105" y="92" width="35" height="78"/><rect x="145" y="70" width="35" height="100"/><rect x="185" y="92" width="35" height="78"/><rect x="225" y="125" width="35" height="45"/><rect x="265" y="145" width="35" height="25"/><rect x="315" y="145" width="35" height="25"/><rect x="355" y="112" width="35" height="58"/><rect x="395" y="78" width="35" height="92"/><rect x="435" y="64" width="35" height="106"/><rect x="475" y="102" width="35" height="68"/><rect x="515" y="142" width="35" height="28"/><rect x="565" y="145" width="35" height="25"/><rect x="605" y="110" width="35" height="60"/><rect x="645" y="75" width="35" height="95"/><rect x="685" y="60" width="35" height="110"/><rect x="725" y="105" width="35" height="65"/><rect x="765" y="140" width="35" height="30"/><rect x="815" y="135" width="35" height="35"/><rect x="855" y="108" width="35" height="62"/><rect x="895" y="90" width="35" height="80"/><rect x="935" y="115" width="35" height="55"/><rect x="975" y="145" width="35" height="25"/></g>
<path class="density" d="M0 168 C90 55 190 40 300 168 C390 65 475 45 565 168 C660 60 760 45 845 168 C925 85 1000 90 1050 155"/>
<text x="20" y="200" font-size="15">Probability in a finite interval: P(a≤x≤b)=∫ₐᵇ |ψ(x)|² dx</text></g>
<rect x="785" y="105" width="335" height="105" rx="14" fill="#eef2ff" stroke="#c7d2fe"/><text x="805" y="135" font-size="17" font-weight="700">Key distinction</text><text x="805" y="161" font-size="15">ψ = probability amplitude</text><text x="805" y="184" font-size="15">|ψ|² = probability density</text>
</svg>