<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Faraday's law and electromagnetic induction</title><desc id="desc">A conducting loop surrounds a changing magnetic flux. Induced electric field circulates around the loop according to Faraday's law.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#374151"/></marker></defs><rect width="1200" height="700" rx="28" fill="#f7f8fc"/><text x="60" y="65" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#172033">Faraday's Law — Electromagnetic Induction</text><text x="60" y="98" font-family="Arial,sans-serif" font-size="18" fill="#69758a">Changing magnetic flux creates a circulating electric field.</text><ellipse cx="430" cy="355" rx="235" ry="170" fill="#fff" stroke="#5753d8" stroke-width="7"/><g stroke="#374151" stroke-width="3"><line x1="300" y1="210" x2="300" y2="500" marker-end="url(#arr)"/><line x1="365" y1="210" x2="365" y2="500" marker-end="url(#arr)"/><line x1="430" y1="210" x2="430" y2="500" marker-end="url(#arr)"/><line x1="495" y1="210" x2="495" y2="500" marker-end="url(#arr)"/><line x1="560" y1="210" x2="560" y2="500" marker-end="url(#arr)"/></g><text x="575" y="250" font-family="Arial,sans-serif" font-size="20" fill="#374151">B(t)</text><g fill="none" stroke="#b63e50" stroke-width="5" marker-end="url(#arr)"><path d="M250 355 C250 245 610 245 610 355"/><path d="M610 355 C610 465 250 465 250 355"/></g><text x="275" y="185" font-family="Arial,sans-serif" font-size="19" fill="#b63e50">induced E circulates around C</text><rect x="760" y="180" width="365" height="345" rx="22" fill="#fff" stroke="#e1e6ef"/><text x="795" y="230" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#172033">Integral form</text><text x="795" y="280" font-family="Arial,sans-serif" font-size="26" fill="#172033">∮ E · dl = − dΦ<tspan baseline-shift="sub" font-size="17">B</tspan>/dt</text><text x="795" y="340" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#172033">Differential form</text><text x="795" y="390" font-family="Arial,sans-serif" font-size="28" fill="#172033">∇ × E = −∂B/∂t</text><text x="795" y="445" font-family="Arial,sans-serif" font-size="16" fill="#69758a">The minus sign is Lenz's law:</text><text x="795" y="470" font-family="Arial,sans-serif" font-size="16" fill="#69758a">the induced field opposes the change</text><text x="795" y="495" font-family="Arial,sans-serif" font-size="16" fill="#69758a">in magnetic flux.</text><text x="60" y="645" font-family="Arial,sans-serif" font-size="17" fill="#69758a">CSIR-NET cue: distinguish a changing magnetic field from a static field and never lose the Faraday minus sign.</text></svg>