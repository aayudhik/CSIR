<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Poynting vector and electromagnetic energy flow</title><desc id="desc">A surface receives electromagnetic energy carried by the Poynting vector E cross H.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#374151"/></marker></defs><rect width="1200" height="700" rx="28" fill="#f7f8fc"/><text x="60" y="65" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#172033">Poynting Vector — Electromagnetic Energy Flow</text><text x="60" y="98" font-family="Arial,sans-serif" font-size="18" fill="#69758a">The vector S = E × H gives electromagnetic energy flux density.</text><rect x="220" y="220" width="300" height="260" rx="12" fill="#fff" stroke="#5753d8" stroke-width="5"/><text x="285" y="510" font-family="Arial,sans-serif" font-size="20" fill="#5753d8">receiving surface A</text><g stroke="#374151" stroke-width="4" marker-end="url(#a)"><line x1="20" y1="285" x2="205" y2="285"/><line x1="20" y1="350" x2="205" y2="350"/><line x1="20" y1="415" x2="205" y2="415"/><line x1="530" y1="350" x2="700" y2="350"/></g><text x="70" y="250" font-family="Arial,sans-serif" font-size="20" fill="#374151">energy transport</text><g transform="translate(865 350)"><line x1="0" y1="0" x2="0" y2="-150" stroke="#b63e50" stroke-width="6" marker-end="url(#a)"/><text x="18" y="-160" font-family="Arial,sans-serif" font-size="21" fill="#b63e50">E</text><line x1="0" y1="0" x2="-145" y2="0" stroke="#14815d" stroke-width="6" marker-end="url(#a)"/><text x="-165" y="-10" font-family="Arial,sans-serif" font-size="21" fill="#14815d">H</text><line x1="0" y1="0" x2="150" y2="0" stroke="#5753d8" stroke-width="7" marker-end="url(#a)"/><text x="165" y="7" font-family="Arial,sans-serif" font-size="22" fill="#5753d8">S=E×H</text></g><rect x="700" y="185" width="420" height="125" rx="20" fill="#fff" stroke="#e1e6ef"/><text x="735" y="230" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172033">Poynting theorem</text><text x="735" y="270" font-family="Arial,sans-serif" font-size="22" fill="#172033">∂u/∂t + ∇·S = −J·E</text><text x="700" y="555" font-family="Arial,sans-serif" font-size="16" fill="#69758a">Power crossing A:  P = ∫ S·dA.  Positive outward flux means field energy leaves the volume.</text><text x="60" y="645" font-family="Arial,sans-serif" font-size="17" fill="#69758a">CSIR-NET cue: distinguish energy flux density S from total power P and track the surface normal.</text></svg>