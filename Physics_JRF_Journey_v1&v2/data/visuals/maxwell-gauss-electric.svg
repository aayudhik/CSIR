<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Gauss's law: electric flux through a Gaussian surface</title><desc id="desc">A point charge lies inside a spherical Gaussian surface. Radial electric field arrows cross the surface and the enclosed charge determines total flux.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#374151"/></marker><radialGradient id="g"><stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#ffffff"/></radialGradient></defs>
<rect width="1200" height="700" rx="28" fill="#f7f8fc"/><text x="60" y="65" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#172033">Gauss's Law — Electric Flux</text><text x="60" y="98" font-family="Arial,sans-serif" font-size="18" fill="#69758a">A closed Gaussian surface converts a symmetric field into a flux–charge relation.</text>
<circle cx="450" cy="360" r="205" fill="url(#g)" stroke="#5753d8" stroke-width="5"/><circle cx="450" cy="360" r="9" fill="#b63e50"/><text x="470" y="350" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#b63e50">q</text>
<g stroke="#374151" stroke-width="3" marker-end="url(#a)"><line x1="450" y1="360" x2="450" y2="155"/><line x1="450" y1="360" x2="655" y2="360"/><line x1="450" y1="360" x2="450" y2="565"/><line x1="450" y1="360" x2="245" y2="360"/><line x1="450" y1="360" x2="595" y2="215"/><line x1="450" y1="360" x2="305" y2="505"/></g>
<g font-family="Arial,sans-serif" fill="#374151" font-size="17"><text x="665" y="365">E</text><text x="425" y="145">dA</text><text x="665" y="175" fill="#5753d8">Gaussian surface S</text></g>
<rect x="760" y="185" width="360" height="330" rx="22" fill="#fff" stroke="#e1e6ef"/><text x="795" y="230" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#172033">Integral form</text><text x="795" y="280" font-family="Arial,sans-serif" font-size="27" fill="#172033">∮ E · dA = Q<tspan baseline-shift="super" font-size="18">enc</tspan> / ε₀</text><text x="795" y="335" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#172033">Differential form</text><text x="795" y="385" font-family="Arial,sans-serif" font-size="29" fill="#172033">∇ · E = ρ / ε₀</text><text x="795" y="440" font-family="Arial,sans-serif" font-size="16" fill="#69758a">Flux counts the net field crossing</text><text x="795" y="465" font-family="Arial,sans-serif" font-size="16" fill="#69758a">a closed surface; symmetry may make E</text><text x="795" y="490" font-family="Arial,sans-serif" font-size="16" fill="#69758a">constant on the chosen surface.</text>
<text x="60" y="645" font-family="Arial,sans-serif" font-size="17" fill="#69758a">CSIR-NET cue: choose the Gaussian surface from symmetry, not merely from the shape of the charge distribution.</text></svg>