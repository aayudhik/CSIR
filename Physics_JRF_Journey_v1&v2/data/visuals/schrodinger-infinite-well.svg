<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Particle in Infinite Potential Well — Energy Levels and Wavefunctions</title>
  <desc id="desc">Four coordinated panels show the infinite potential well, quantized energy levels proportional to n squared, the first four stationary wavefunctions, and probability densities.</desc>
  <defs>
    <style>
      .title{font:700 28px system-ui,sans-serif;fill:#172033}.subtitle{font:italic 14px system-ui,sans-serif;fill:#69758a}.head{font:700 17px system-ui,sans-serif;fill:#172033}.label{font:13px system-ui,sans-serif;fill:#344054}.small{font:12px system-ui,sans-serif;fill:#596477}.note{font:italic 12px system-ui,sans-serif;fill:#69758a}.axis{stroke:#344054;stroke-width:2}.grid{stroke:#dfe4ec;stroke-width:1}.wall{fill:#172033}.boundary{stroke:#7f8c8d;stroke-width:2;stroke-dasharray:6 5}.wf{fill:none;stroke:#2c3e50;stroke-width:3}.energy{stroke:#c94b59;stroke-width:3}.p1{fill:#6b65d8;fill-opacity:.28;stroke:#514bc6;stroke-width:2}.p2{fill:#d67a35;fill-opacity:.25;stroke:#a85a1f;stroke-width:2}.p3{fill:#4f9a77;fill-opacity:.25;stroke:#357355;stroke-width:2}.panel{fill:#fff;stroke:#e1e6ef;stroke-width:1.5}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#344054"/></marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0,0L10,10M10,0L0,10" stroke="#b8c0cc" stroke-width="1"/></pattern>
  </defs>

  <text x="600" y="34" text-anchor="middle" class="title">Particle in Infinite Potential Well</text>
  <text x="600" y="57" text-anchor="middle" class="subtitle">Energy levels, stationary wavefunctions, and probability density</text>

  <!-- Potential -->
  <rect x="30" y="80" width="350" height="350" rx="14" class="panel"/>
  <text x="55" y="110" class="head">1. Potential V(x)</text>
  <line x1="85" y1="375" x2="85" y2="145" class="axis" marker-end="url(#arrow)"/>
  <line x1="85" y1="375" x2="330" y2="375" class="axis" marker-end="url(#arrow)"/>
  <rect x="68" y="155" width="17" height="220" class="wall"/>
  <rect x="313" y="155" width="17" height="220" class="wall"/>
  <rect x="85" y="180" width="228" height="195" fill="#f8f9fb" stroke="#aab2bf"/>
  <rect x="40" y="155" width="28" height="220" fill="url(#hatch)"/>
  <rect x="330" y="155" width="28" height="220" fill="url(#hatch)"/>
  <text x="48" y="143" class="small">V = ∞</text><text x="176" y="202" class="small">V = 0</text><text x="322" y="143" class="small">V = ∞</text>
  <text x="78" y="397" class="label">0</text><text x="197" y="397" class="label">a/2</text><text x="315" y="397" class="label">a</text>
  <text x="62" y="150" class="label">V</text><text x="334" y="382" class="label">x</text>
  <path d="M190 290 L190 245" class="axis" marker-end="url(#arrow)"/>
  <text x="202" y="282" class="note">Particle confined</text><text x="202" y="298" class="note">to 0 &lt; x &lt; a</text>
  <text x="42" y="415" class="small">Classically forbidden outside the walls</text>

  <!-- Energy levels -->
  <rect x="405" y="80" width="350" height="350" rx="14" class="panel"/>
  <text x="430" y="110" class="head">2. Quantized Energy Levels</text>
  <line x1="465" y1="375" x2="465" y2="140" class="axis" marker-end="url(#arrow)"/>
  <line x1="465" y1="375" x2="720" y2="375" class="axis" marker-end="url(#arrow)"/>
  <line x1="480" y1="325" x2="690" y2="325" class="energy"/>
  <line x1="480" y1="265" x2="690" y2="265" class="energy"/>
  <line x1="480" y1="185" x2="690" y2="185" class="energy"/>
  <line x1="480" y1="145" x2="690" y2="145" class="energy"/>
  <text x="470" y="330" text-anchor="end" class="label">E₁</text><text x="700" y="330" class="small">π²ℏ²/(2ma²)</text>
  <text x="470" y="270" text-anchor="end" class="label">E₂</text><text x="700" y="270" class="small">4E₁</text>
  <text x="470" y="190" text-anchor="end" class="label">E₃</text><text x="700" y="190" class="small">9E₁</text>
  <text x="470" y="150" text-anchor="end" class="label">E₄</text><text x="700" y="150" class="small">16E₁</text>
  <path d="M705 325L725 325M715 325L715 265M705 265L725 265" stroke="#69758a" fill="none"/>
  <text x="695" y="305" class="note">spacing</text><text x="695" y="320" class="note">grows</text>
  <text x="475" y="405" class="note">Eₙ = n²π²ℏ²/(2ma²)  →  energies grow as n²</text>

  <!-- Wavefunctions -->
  <rect x="780" y="80" width="390" height="350" rx="14" class="panel"/>
  <text x="805" y="110" class="head">3. Stationary Wavefunctions φₙ(x)</text>
  <line x1="830" y1="375" x2="1130" y2="375" class="axis"/>
  <line x1="830" y1="145" x2="830" y2="375" class="boundary"/><line x1="1130" y1="145" x2="1130" y2="375" class="boundary"/>
  <line x1="830" y1="325" x2="1130" y2="325" class="grid"/><line x1="830" y1="270" x2="1130" y2="270" class="grid"/><line x1="830" y1="215" x2="1130" y2="215" class="grid"/><line x1="830" y1="160" x2="1130" y2="160" class="grid"/>
  <path d="M830 325 Q980 205 1130 325" class="wf"/>
  <path d="M830 270 Q905 185 980 270 Q1055 355 1130 270" class="wf"/>
  <path d="M830 215 Q880 155 930 215 Q980 275 1030 215 Q1080 155 1130 215" class="wf"/>
  <path d="M830 160 Q868 115 905 160 Q943 205 980 160 Q1018 115 1055 160 Q1093 205 1130 160" class="wf"/>
  <text x="815" y="330" text-anchor="end" class="label">n=1</text><text x="815" y="275" text-anchor="end" class="label">n=2</text><text x="815" y="220" text-anchor="end" class="label">n=3</text><text x="815" y="165" text-anchor="end" class="label">n=4</text>
  <text x="830" y="397" class="small">x=0</text><text x="1110" y="397" class="small">x=a</text>
  <text x="870" y="415" class="note">φₙ(x)=√(2/a) sin(nπx/a) · n−1 internal nodes</text>

  <!-- Probability -->
  <rect x="30" y="460" width="1140" height="380" rx="14" class="panel"/>
  <text x="55" y="492" class="head">4. Probability Density |φₙ(x)|²</text>
  <text x="55" y="514" class="note">Nodes of φₙ are points of zero probability density.</text>
  <line x1="100" y1="790" x2="100" y2="545" class="axis" marker-end="url(#arrow)"/>
  <line x1="100" y1="790" x2="1100" y2="790" class="axis" marker-end="url(#arrow)"/>
  <line x1="150" y1="790" x2="1050" y2="790" class="boundary"/>
  <path d="M150 790 Q375 570 600 790 Q825 570 1050 790 Z" class="p1"/>
  <path d="M150 790 Q262 650 375 790 Q487 650 600 790 Q712 650 825 790 Q937 650 1050 790 Z" class="p2"/>
  <path d="M150 790 Q225 675 300 790 Q375 675 450 790 Q525 675 600 790 Q675 675 750 790 Q825 675 900 790 Q975 675 1050 790 Z" class="p3"/>
  <text x="112" y="742" class="label">|φ₁|²</text><text x="112" y="682" class="label">|φ₂|²</text><text x="112" y="622" class="label">|φ₃|²</text>
  <text x="595" y="815" text-anchor="middle" class="small">0 &lt; x &lt; a</text><text x="72" y="555" class="label">probability</text>
  <text x="780" y="555" class="note">More nodes → more oscillations</text>
  <text x="780" y="575" class="note">φ(x)=0 at a node → |φ(x)|²=0 there</text>
  <text x="780" y="595" class="note">Probability in an interval = ∫ |φ(x)|² dx</text>

  <rect x="55" y="525" width="8" height="8" class="p1"/><text x="70" y="533" class="small">n=1</text>
  <rect x="125" y="525" width="8" height="8" class="p2"/><text x="140" y="533" class="small">n=2</text>
  <rect x="195" y="525" width="8" height="8" class="p3"/><text x="210" y="533" class="small">n=3</text>

  <text x="600" y="865" text-anchor="middle" class="subtitle">Quantization emerges because only standing waves satisfying both boundary conditions are allowed.</text>
</svg>
