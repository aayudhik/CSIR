<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Electromagnetic plane wave geometry</title><desc id="desc">Electric field, magnetic field and propagation vector are mutually perpendicular in a plane electromagnetic wave.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#374151"/></marker></defs><rect width="1200" height="700" rx="28" fill="#f7f8fc"/><text x="60" y="65" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#172033">Electromagnetic Plane Wave</text><text x="60" y="98" font-family="Arial,sans-serif" font-size="18" fill="#69758a">E, B and the propagation direction k form a mutually perpendicular triad.</text><g transform="translate(420 355)"><line x1="-280" y1="0" x2="330" y2="0" stroke="#374151" stroke-width="4" marker-end="url(#a)"/><text x="340" y="7" font-family="Arial,sans-serif" font-size="23" fill="#374151">k</text><path d="M-260 0 C-210 -90 -160 90 -110 0 S-10 -90 40 0 S140 90 190 0 S290 -90 320 0" fill="none" stroke="#5753d8" stroke-width="6"/><text x="115" y="-105" font-family="Arial,sans-serif" font-size="21" fill="#5753d8">E</text><line x1="0" y1="0" x2="0" y2="-205" stroke="#b63e50" stroke-width="5" marker-end="url(#a)"/><text x="15" y="-215" font-family="Arial,sans-serif" font-size="21" fill="#b63e50">E</text><line x1="0" y1="0" x2="0" y2="180" stroke="#14815d" stroke-width="5" marker-end="url(#a)"/><text x="18" y="195" font-family="Arial,sans-serif" font-size="21" fill="#14815d">B</text></g><rect x="760" y="180" width="365" height="350" rx="22" fill="#fff" stroke="#e1e6ef"/><text x="795" y="230" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#172033">Vacuum relations</text><text x="795" y="280" font-family="Arial,sans-serif" font-size="27" fill="#172033">E ⟂ B ⟂ k</text><text x="795" y="330" font-family="Arial,sans-serif" font-size="23" fill="#172033">B = (1/ω) k × E</text><text x="795" y="375" font-family="Arial,sans-serif" font-size="23" fill="#172033">E/B = c</text><text x="795" y="420" font-family="Arial,sans-serif" font-size="23" fill="#172033">c = 1/√(μ₀ε₀)</text><text x="795" y="470" font-family="Arial,sans-serif" font-size="16" fill="#69758a">The curl equations force the transverse</text><text x="795" y="495" font-family="Arial,sans-serif" font-size="16" fill="#69758a">field geometry in a source-free plane wave.</text><text x="60" y="645" font-family="Arial,sans-serif" font-size="17" fill="#69758a">CSIR-NET cue: use the right-hand-rule direction of k relative to E and B.</text></svg>