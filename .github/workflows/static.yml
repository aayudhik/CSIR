name: Deploy CSIR V5.8

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Select V5.8 application entrypoint
        run: cp "Physics_JRF_Journey_v1&v2/v58-final.html" "Physics_JRF_Journey_v1&v2/index.html"

      - name: Inject V5.8.4 SEO metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('Physics_JRF_Journey_v1&v2')
          index = root / 'index.html'
          head = (root / 'v584-head.html').read_text(encoding='utf-8')
          text = index.read_text(encoding='utf-8')
          text = text.replace('</head>', head + '</head>', 1)
          index.write_text(text, encoding='utf-8')
          PY

      - name: Inject V5.8 enhancement layers
        run: sed -i 's#</body>#<script src="v58-enhancements.js?v=5.8.3"></script><script src="v584-public.js?v=5.8.4"></script><script src="v585-accessibility.js?v=5.8.5"></script><script src="v586-learning.js?v=5.8.6"></script><script src="v587-exam-intelligence.js?v=5.8.7"></script></body>#' "Physics_JRF_Journey_v1&v2/index.html"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "Physics_JRF_Journey_v1&v2"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
