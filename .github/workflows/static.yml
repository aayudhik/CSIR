name: Deploy CSIR V5.9

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate application source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="Physics_JRF_Journey_v1&v2"
          test -s "$ROOT/v58-final.html"
          test -s "$ROOT/v58-enhancements.js"
          test -s "$ROOT/v590-clean-brand.js"
          test -s "$ROOT/v585-accessibility.js"
          test -s "$ROOT/v586-learning.js"
          test -s "$ROOT/v587-exam-intelligence.js"
          test -s "$ROOT/tools/content-audit-v59.js"
          test -s "$ROOT/sw.js"
          test -s "$ROOT/manifest.webmanifest"
          test -s "$ROOT/data/study-content.json"
          test -s "$ROOT/data/question-bank.json"
          test -s "$ROOT/data/paper-index.json"
          test -s "$ROOT/data/pyq-index.json"
          test -s "$ROOT/data/reference-books.json"
          for f in "$ROOT"/*.js "$ROOT"/tools/*.js; do node --check "$f"; done
          node -e "const fs=require('fs'); for(const f of fs.readdirSync('$ROOT/data').filter(x=>x.endsWith('.json'))){JSON.parse(fs.readFileSync('$ROOT/data/'+f,'utf8')); console.log('JSON OK:',f)}"
          node -e "JSON.parse(require('fs').readFileSync('$ROOT/manifest.webmanifest','utf8'))"
      - name: Run V5.9 deep content audit
        shell: bash
        run: |
          set -euo pipefail
          node "Physics_JRF_Journey_v1&v2/tools/content-audit-v59.js"
          test -s "Physics_JRF_Journey_v1&v2/data/content-audit-v5.9.json"
          node -e "const r=JSON.parse(require('fs').readFileSync('Physics_JRF_Journey_v1&v2/data/content-audit-v5.9.json','utf8')); if(r.version!=='V5.9'||!r.summary||!Array.isArray(r.topics)) process.exit(1); console.log('Audit OK:',r.summary)"
      - name: Select V5.9 application entrypoint
        run: cp "Physics_JRF_Journey_v1&v2/v58-final.html" "Physics_JRF_Journey_v1&v2/index.html"
      - name: Apply fast non-blocking data startup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path('Physics_JRF_Journey_v1&v2')
          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          new_load = "\n".join([
              "async function load(){",
              "  data={subjects:[],topics:[]};",
              "  questions=[]; papers=[]; books=[];",
              "  initNav(); bind(); renderHome(); renderTopics(); renderBooks(); renderPapers(); renderPractice(true); renderRevision(true); renderMock(false); renderPlanner();",
              "  const get=async(url)=>{const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);return r.json()};",
              "  const fail=(name,e)=>{console.warn('V5.9 data load failed:',name,e);};",
              "  get(DATA+'?v=5.9.0').then(s=>{data=s;data.topics=flatTopics(s);fillSelectors();renderHome();renderTopics();renderPlanner()}).catch(e=>fail('study content',e));",
              "  get(QB+'?v=5.9.0').then(q=>{questions=q.questions||[];renderHome();renderPractice(true);renderMock(false)}).catch(e=>fail('question bank',e));",
              "  get(PAPERS+'?v=5.9.0').then(p=>{papers=p.papers||[];renderPapers()}).catch(e=>fail('question papers',e));",
              "  get(BOOKS+'?v=5.9.0').then(b=>{books=b.subjects||[];renderBooks()}).catch(e=>fail('reference books',e));",
              "}"
          ])
          start = text.find('async function load(){')
          end = text.find('\nfunction init()', start)
          if start < 0 or end < 0: raise SystemExit('Could not locate application load() function')
          text = text[:start] + new_load + '\nfunction init()' + text[end + len('\nfunction init()'):]
          index.write_text(text, encoding='utf-8')
          PY
      - name: Refresh service worker cache version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Physics_JRF_Journey_v1&v2/sw.js')
          t=p.read_text(encoding='utf-8')
          import re
          t=re.sub(r"const VERSION='[^']+';", "const VERSION='pjr-v590-2';", t, count=1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Inject SEO metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('Physics_JRF_Journey_v1&v2'); index=root/'index.html'
          head=(root/'v584-head.html').read_text(encoding='utf-8')
          text=index.read_text(encoding='utf-8').replace('</head>',head+'</head>',1)
          index.write_text(text,encoding='utf-8')
          PY
      - name: Inject V5.9 application layers
        run: sed -i 's#</body>#<script src="v58-enhancements.js?v=5.9.0"></script><script src="v585-accessibility.js?v=5.8.5"></script><script src="v586-learning.js?v=5.8.6"></script><script src="v587-exam-intelligence.js?v=5.8.7"></script><script src="v590-clean-brand.js?v=5.9.0"></script></body>#' "Physics_JRF_Journey_v1&v2/index.html"
      - name: Remove legacy V5.8 FINAL branding from generated site
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('Physics_JRF_Journey_v1&v2/index.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace('V5.8 FINAL','')
          p.write_text(text,encoding='utf-8')
          PY
      - name: Validate generated Pages entrypoint
        shell: bash
        run: |
          set -euo pipefail
          INDEX="Physics_JRF_Journey_v1&v2/index.html"
          test -s "$INDEX"
          for src in v58-enhancements.js v585-accessibility.js v586-learning.js v587-exam-intelligence.js v590-clean-brand.js; do grep -q "$src" "$INDEX"; done
          if grep -q 'v584-public.js' "$INDEX"; then echo 'Removed public layer still present'; exit 1; fi
          if grep -q 'V5.8 FINAL' "$INDEX"; then echo 'Legacy V5.8 FINAL branding still present'; exit 1; fi
          grep -q 'v=5.9.0' "$INDEX"
          grep -q 'Welcome Dear CSIR Aspirant' "$INDEX"
          grep -q '</body>' "$INDEX"
      - name: Validate generated JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('Physics_JRF_Journey_v1&v2/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*application/ld\+json)[^>]*>(.*?)</script>',text,re.S|re.I)
          if not scripts: raise SystemExit('Inline application script not found')
          Path('/tmp/app.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "Physics_JRF_Journey_v1&v2"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
