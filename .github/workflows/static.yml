name: Deploy CSIR V5.8

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Select V5.8 application entrypoint
        run: cp "Physics_JRF_Journey_v1&v2/v58-final.html" "Physics_JRF_Journey_v1&v2/index.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "Physics_JRF_Journey_v1&v2"

      - uses: actions/deploy-pages@v5
