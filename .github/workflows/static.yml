name: Deploy CSIR V5.9.1 Stable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ROOT: Physics_JRF_Journey_v1&v2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate source files and JSON
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ROOT/v58-final.html"
          test -s "$ROOT/v58-enhancements.js"
          test -s "$ROOT/v585-accessibility.js"
          test -s "$ROOT/v586-learning.js"
          test -s "$ROOT/v587-exam-intelligence.js"
          test -s "$ROOT/v590-clean-brand.js"
          test -s "$ROOT/v591-spaced-review.js"
          test -s "$ROOT/v584-head.html"
          test -s "$ROOT/tools/build-v591-expansion.js"
          test -s "$ROOT/tools/build-v591-pages.js"
          test -s "$ROOT/tools/content-audit-v59.js"
          test -s "$ROOT/sw.js"
          test -s "$ROOT/manifest.webmanifest"
          for f in "$ROOT"/*.js "$ROOT"/tools/*.js; do node --check "$f"; done
          node - <<'NODE'
          const fs=require('fs');
          const root=process.env.ROOT;
          for(const f of fs.readdirSync(`${root}/data`).filter(x=>x.endsWith('.json'))){JSON.parse(fs.readFileSync(`${root}/data/${f}`,'utf8'));console.log('JSON OK:',f)}
          JSON.parse(fs.readFileSync(`${root}/manifest.webmanifest`,'utf8'));
          NODE
      - name: Generate and validate V5.9.1 expansion source
        shell: bash
        run: |
          set -euo pipefail
          node "$ROOT/tools/build-v591-expansion.js"
          node - <<'NODE'
          const fs=require('fs');
          const p=`${process.env.ROOT}/data/content-expansion-v5.9.1.json`;
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(!Array.isArray(r.topics)||r.topics.length<30) throw new Error('Expansion topics must contain at least 30 normalized topics');
          if(!Array.isArray(r.questions)||r.questions.length<150) throw new Error('Expansion question bank must contain at least 150 questions');
          console.log(`Expansion source OK: ${r.topics.length} topics, ${r.questions.length} questions`);
          NODE
      - name: Build deterministic Pages entrypoint from V5.8 base
        shell: bash
        run: |
          set -euo pipefail
          node "$ROOT/tools/build-v591-pages.js"
          test -s "$ROOT/index.html"
      - name: Run merged-content audit after assembly
        shell: bash
        run: |
          set -euo pipefail
          node "$ROOT/tools/content-audit-v59.js"
          test -s "$ROOT/data/content-audit-v5.9.json"
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(`${process.env.ROOT}/data/content-audit-v5.9.json`,'utf8'));
          if(!r.summary||r.summary.topic_count<120||!Array.isArray(r.topics)) throw new Error('Merged audit did not meet minimum topic coverage');
          console.log('Merged audit OK:',r.summary);
          NODE
      - name: Validate generated application artifact
        shell: bash
        run: |
          set -euo pipefail
          INDEX="$ROOT/index.html"
          test -s "$INDEX"
          grep -q 'Welcome Dear CSIR Aspirant' "$INDEX"
          grep -q 'content-expansion-v5.9.1.json?v=5.9.1' "$INDEX"
          grep -q 'pjr:data-ready' "$INDEX"
          for src in v58-enhancements.js v585-accessibility.js v586-learning.js v587-exam-intelligence.js v590-clean-brand.js v591-spaced-review.js; do grep -q "$src" "$INDEX"; done
          if grep -q 'v584-public.js' "$INDEX"; then echo 'Removed public layer still present'; exit 1; fi
          if grep -q 'V5.8 FINAL' "$INDEX"; then echo 'Legacy V5.8 FINAL branding still present'; exit 1; fi
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync(`${process.env.ROOT}/index.html`,'utf8');
          const scripts=[...html.matchAll(/<script(?![^>]*application\/ld\+json)[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          if(scripts.length!==1) throw new Error(`Expected one inline application script, found ${scripts.length}`);
          new vm.Script(scripts[0],{filename:'generated-index-inline.js'});
          if((html.match(/async function load\(\)\{/g)||[]).length!==1) throw new Error('Generated index contains an invalid load() structure');
          if(!/<\/body>\s*<\/html>\s*$/.test(html)) throw new Error('Generated HTML closing structure is invalid');
          console.log('Generated index syntax OK');
          NODE
      - name: Verify Pages artifact contents before upload
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html data/study-content.json data/question-bank.json data/content-expansion-v5.9.1.json data/content-audit-v5.9.json; do test -f "$ROOT/$f"; done
          find "$ROOT" -maxdepth 2 -type f | sort | head -200
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./Physics_JRF_Journey_v1&v2
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed Pages response
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          for attempt in 1 2 3 4 5; do
            RESPONSE="$(curl -fsSL --max-time 20 "$PAGE_URL")"
            if grep -q 'Welcome Dear CSIR Aspirant' <<< "$RESPONSE"; then
              echo "Pages deployment verified: $PAGE_URL"
              exit 0
            fi
            echo "Verification attempt $attempt: application marker not found yet"
            sleep 10
          done
          echo "Pages deployment did not return the expected application marker: $PAGE_URL"
          exit 1
