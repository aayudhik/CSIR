name: Deploy CSIR V5 Final Stable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ROOT: Physics_JRF_Journey_v1&v2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate source files and JSON
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ROOT/v58-final.html"
          test -s "$ROOT/v58-enhancements.js"
          test -s "$ROOT/v585-accessibility.js"
          test -s "$ROOT/v586-learning.js"
          test -s "$ROOT/v587-exam-intelligence.js"
          test -s "$ROOT/v590-clean-brand.js"
          test -s "$ROOT/v591-spaced-review.js"
          test -s "$ROOT/v592-review.js"
          test -s "$ROOT/v592-ui-cleanup.js"
          test -s "$ROOT/v584-head.html"
          test -s "$ROOT/tools/build-v591-expansion.js"
          test -s "$ROOT/tools/build-v591-pages.js"
          test -s "$ROOT/tools/content-audit-v59.js"
          test -s "$ROOT/tools/content-audit-v510.js"
          test -s "$ROOT/sw.js"
          test -s "$ROOT/manifest.webmanifest"
          test -s "$ROOT/landing.html"
          test -s "$ROOT/sitemap.xml"
          test -s "$ROOT/robots.txt"
          test -s "$ROOT/assets/og-image.svg"
          for f in "$ROOT"/*.js "$ROOT"/tools/*.js; do node --check "$f"; done
          node - <<'NODE'
          const fs=require('fs');
          const root=process.env.ROOT;
          for(const f of fs.readdirSync(`${root}/data`).filter(x=>x.endsWith('.json'))){
            JSON.parse(fs.readFileSync(`${root}/data/${f}`,'utf8'));
            console.log('JSON OK:',f);
          }
          JSON.parse(fs.readFileSync(`${root}/manifest.webmanifest`,'utf8'));
          NODE

      - name: Generate and validate V5.9.1 expansion source
        shell: bash
        run: |
          set -euo pipefail
          node "$ROOT/tools/build-v591-expansion.js"
          node - <<'NODE'
          const fs=require('fs');
          const root=process.env.ROOT;
          const p=`${root}/data/content-expansion-v5.9.1.json`;
          const q=`${root}/data/question-bank.json`;
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const base=JSON.parse(fs.readFileSync(q,'utf8'));
          const baseCount=Array.isArray(base.questions)?base.questions.length:0;
          const expansionCount=Array.isArray(r.questions)?r.questions.length:0;
          if(!Array.isArray(r.topics)||r.topics.length<30) throw new Error('Expansion topics must contain at least 30 normalized topics');
          if(expansionCount<300) throw new Error('Expansion question bank must contain at least 300 questions');
          if(baseCount+expansionCount<1500) throw new Error(`Merged question target not met: ${baseCount}+${expansionCount}=${baseCount+expansionCount}`);
          console.log(`Expansion source OK: ${r.topics.length} topics, ${expansionCount} expansion questions, ${baseCount+expansionCount} total questions`);
          NODE

      - name: Run V5.10 automated 123-topic content-depth audit
        shell: bash
        run: |
          set -euo pipefail
          node "$ROOT/tools/content-audit-v510.js"
          test -s "$ROOT/data/content-depth-audit-v5.10.json"
          test -s "$ROOT/data/content-depth-audit-v5.10.md"
          node - <<'NODE'
          const fs=require('fs');
          const root=process.env.ROOT;
          const r=JSON.parse(fs.readFileSync(`${root}/data/content-depth-audit-v5.10.json`,'utf8'));
          const s=r.summary;
          if(!s || s.topic_count<120) throw new Error(`V5.10 audit topic coverage too low: ${s?.topic_count}`);
          if(!Array.isArray(r.topics) || r.topics.length!==s.topic_count) throw new Error('V5.10 audit topic array mismatch');
          if(!Array.isArray(r.critical_topics) || r.critical_topics.length<10) throw new Error('V5.10 critical-topic audit incomplete');
          console.log('V5.10 baseline:', JSON.stringify(s));
          console.log('V5.10 priority:', r.priority_topics.slice(0,10).map(t=>`${t.subject_id}:${t.topic}=${t.depth_score_10}`).join(' | '));
          NODE

      - name: Build deterministic V5 final Pages entrypoint
        shell: bash
        run: |
          set -euo pipefail
          node "$ROOT/tools/build-v591-pages.js"
          test -s "$ROOT/index.html"

      - name: Validate generated index before deployment
        shell: bash
        run: |
          set -euo pipefail
          INDEX="$ROOT/index.html"
          test -s "$INDEX"
          grep -q '^<!doctype html>' "$INDEX"
          grep -qi '<html[^>]*>' "$INDEX"
          grep -qi '<head>' "$INDEX"
          grep -qi '</head>' "$INDEX"
          grep -qi '<body' "$INDEX"
          grep -qi '</body>' "$INDEX"
          grep -qi '</html>' "$INDEX"
          grep -q '<title>Physics JRF Journey</title>' "$INDEX"
          ! grep -qE '\$\{[^}]+\}|<<<<<<<|=======|>>>>>>>' "$INDEX"
          test "$(grep -oi '<html\b' "$INDEX" | wc -l)" -eq 1
          test "$(grep -oi '</html>' "$INDEX" | wc -l)" -eq 1
          test "$(grep -oi '<body\b' "$INDEX" | wc -l)" -eq 1
          test "$(grep -oi '</body>' "$INDEX" | wc -l)" -eq 1
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync(process.env.ROOT+'/index.html','utf8');
          const src=[...html.matchAll(/<script[^>]+src=[\"']([^\"']+)[\"']/gi)].map(m=>m[1].split('?')[0]);
          for(const s of src){
            if(/^(https?:)?\//.test(s)) continue;
            if(!fs.existsSync(process.env.ROOT+'/'+s)) throw new Error('Generated index references missing script: '+s);
          }
          const inline=[...html.matchAll(/<script(?![^>]*application\/ld\+json)[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          if(inline.length!==1) throw new Error('Expected exactly one inline application script, found '+inline.length);
          console.log('Generated index validation OK:', {bytes:html.length, scripts:src.length, inlineScripts:inline.length});
          NODE

      - name: Run merged-content audit after assembly
        shell: bash
        run: |
          set -euo pipefail
          node "$ROOT/tools/content-audit-v59.js"
          test -s "$ROOT/data/content-audit-v5.9.json"
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(`${process.env.ROOT}/data/content-audit-v5.9.json`,'utf8'));
          if(!r.summary||r.summary.topic_count<120||!Array.isArray(r.topics)) throw new Error('Merged audit did not meet minimum topic coverage');
          console.log('Merged audit OK:',r.summary);
          NODE

      - name: Publish content-depth audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: v5-final-content-depth-audit
          path: |
            ${{ env.ROOT }}/data/content-depth-audit-v5.10.json
            ${{ env.ROOT }}/data/content-depth-audit-v5.10.md
          if-no-files-found: error

      - name: Verify Pages artifact contents before upload
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html landing.html sitemap.xml robots.txt assets/og-image.svg data/study-content.json data/question-bank.json data/content-expansion-v5.9.1.json data/content-audit-v5.9.json data/content-depth-audit-v5.10.json data/content-depth-audit-v5.10.md; do
            test -f "$ROOT/$f"
          done
          echo 'Pages artifact contents verified'

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./Physics_JRF_Journey_v1&v2

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed V5 response
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          for attempt in 1 2 3 4 5; do
            RESPONSE="$(curl -fsSL --max-time 20 "$PAGE_URL")"
            if grep -q '<title>Physics JRF Journey</title>' <<< "$RESPONSE" && ! grep -qE '\$\{[^}]+\}|<<<<<<<|=======|>>>>>>>' <<< "$RESPONSE"; then
              echo "V5 final deployment verified: $PAGE_URL"
              exit 0
            fi
            echo "Verification attempt $attempt: generated application not ready or contains invalid template markers"
            sleep 10
          done
          echo "V5 deployment verification failed: $PAGE_URL"
          exit 1
