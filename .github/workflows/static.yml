name: Deploy CSIR V5.8

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Select V5.8 application entrypoint
        run: cp "Physics_JRF_Journey_v1&v2/v58-final.html" "Physics_JRF_Journey_v1&v2/index.html"

      - name: Inject V5.8.2 stability and UX layer
        run: sed -i 's#</body>#<script src="v58-enhancements.js?v=5.8.2"></script></body>#' "Physics_JRF_Journey_v1&v2/index.html"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "Physics_JRF_Journey_v1&v2"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
