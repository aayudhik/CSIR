name: Deploy CSIR V5.8

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate application source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="Physics_JRF_Journey_v1&v2"
          test -s "$ROOT/v58-final.html"
          test -s "$ROOT/v58-enhancements.js"
          test -s "$ROOT/v584-public.js"
          test -s "$ROOT/v585-accessibility.js"
          test -s "$ROOT/v586-learning.js"
          test -s "$ROOT/v587-exam-intelligence.js"
          test -s "$ROOT/sw.js"
          test -s "$ROOT/manifest.webmanifest"
          test -s "$ROOT/data/study-content.json"
          test -s "$ROOT/data/question-bank.json"
          test -s "$ROOT/data/paper-index.json"
          test -s "$ROOT/data/pyq-index.json"
          test -s "$ROOT/data/reference-books.json"
          for f in "$ROOT"/*.js; do node --check "$f"; done
          node -e "const fs=require('fs'); for(const f of fs.readdirSync('$ROOT/data').filter(x=>x.endsWith('.json'))){JSON.parse(fs.readFileSync('$ROOT/data/'+f,'utf8')); console.log('JSON OK:',f)}"
          node -e "JSON.parse(fs.readFileSync('$ROOT/manifest.webmanifest','utf8'))" 2>/dev/null || node -e "JSON.parse(require('fs').readFileSync('$ROOT/manifest.webmanifest','utf8'))"

      - name: Select V5.8 application entrypoint
        run: cp "Physics_JRF_Journey_v1&v2/v58-final.html" "Physics_JRF_Journey_v1&v2/index.html"

      - name: Inject V5.8.4 SEO metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('Physics_JRF_Journey_v1&v2')
          index = root / 'index.html'
          head = (root / 'v584-head.html').read_text(encoding='utf-8')
          text = index.read_text(encoding='utf-8')
          text = text.replace('</head>', head + '</head>', 1)
          index.write_text(text, encoding='utf-8')
          PY

      - name: Inject V5.8 enhancement layers
        run: sed -i 's#</body>#<script src="v58-enhancements.js?v=5.8.3"></script><script src="v584-public.js?v=5.8.4"></script><script src="v585-accessibility.js?v=5.8.5"></script><script src="v586-learning.js?v=5.8.6"></script><script src="v587-exam-intelligence.js?v=5.8.7"></script></body>#' "Physics_JRF_Journey_v1&v2/index.html"

      - name: Validate generated Pages entrypoint
        shell: bash
        run: |
          set -euo pipefail
          INDEX="Physics_JRF_Journey_v1&v2/index.html"
          test -s "$INDEX"
          for src in v58-enhancements.js v584-public.js v585-accessibility.js v586-learning.js v587-exam-intelligence.js; do
            grep -q "$src" "$INDEX"
          done
          grep -q 'Welcome Dear CSIR Aspirant' "$INDEX"
          grep -q '</body>' "$INDEX"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "Physics_JRF_Journey_v1&v2"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
